<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本人平均缴费指数计算器</title>
<link rel="stylesheet" href="./style.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<header class="site-header">
  <h1>本人平均缴费指数计算器</h1>
  <p>选择参保地，录入或导入逐年缴费数据，一键算出平均缴费指数与个人账户余额</p>
</header>

<main class="container">
  <section class="card">
    <label class="field-label" for="province">参保地</label>
    <select id="province"></select>
  </section>

  <section class="card">
    <div class="tabs">
      <button class="tab active" data-tab="manual">手动录入</button>
      <button class="tab" data-tab="excel">Excel 导入</button>
    </div>

    <div id="panel-manual" class="tab-panel">
      <div id="manualRows"></div>
      <button id="addRow" class="btn-secondary">+ 添加一行</button>
    </div>

    <div id="panel-excel" class="tab-panel hidden">
      <div class="excel-bar">
        <label class="upload-btn">
          选择 Excel 文件
          <input type="file" id="excelFile" accept=".xlsx,.xls">
        </label>
        <button id="dlTemplate" class="btn-link">下载导入模板</button>
      </div>
      <p class="hint">支持列名：<b>年份</b>、<b>缴费月数</b>、<b>月缴费基数</b>（即当年月平均缴费工资）。也兼容“年缴费工资 / 年基数”等写法。解析后可预览核对。</p>
      <div id="excelPreview" class="preview hidden"></div>
    </div>
  </section>

  <button id="calcBtn" class="btn-primary">计算</button>

  <section id="result" class="card result hidden"></section>

  <footer class="site-footer">
    <p>纯浏览器计算，数据不上传服务器 · 引擎与微信小程序同源</p>
  </footer>
</main>

<script src="./calc-index.js"></script>
<script src="./provinces-index-data.js"></script>
<script src="./app.js"></script>
</body>
</html>
